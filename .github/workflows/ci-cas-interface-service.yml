name: CI CAS Interface Service

# [1] WHEN IT RUNS — PRs, merges, a twice-monthly re-scan, and a manual button.
#     paths = this service's dir + the shared library it references (Shared.Database).
on:
  pull_request:
    branches: [develop]
    paths:
      - "CASInterfaceService/**"
      - "Shared.Database/**"
  push:
    branches: [develop]
    paths:
      - "CASInterfaceService/**"
      - "Shared.Database/**"
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code, write scan reports, nothing else
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE RUN AT A TIME — a newer push cancels the outdated run (per-service group)
concurrency:
  group: ci-cas-interface-service-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — 'gate' is the exact check name branch protection requires green
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # [5] SETUP -> CodeQL init (before build so it traces compilation) -> compile -> CodeQL analyze
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      # ── compile the .NET service (also restores its Shared.Database project reference) ──
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build CASInterfaceService/CASInterfaceService/cas-interface-service.csproj -c Release

      # ── CodeQL writes its C# report over the build it just traced ──
      - uses: github/codeql-action/analyze@v4
