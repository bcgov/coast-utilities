# .github/dependabot.yml — actions-only, monthly, one grouped PR.
# Alerts + security-update PRs for app packages (nuget) come from the repo
# security toggles, NOT this file — so app packages get zero robot upgrade spam.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
