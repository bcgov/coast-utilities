# Which updates Dependabot proposes, and how often.
# Each pull request goes to its owner: for an action the workflows are pinned to and for a base image a
# Dockerfile starts from, DevOps; for a package, the Technical Lead. Images and packages are minor and patch
# only: a major is planned with the team. Dependabot looks every day: the sector standard asks for daily.
version: 2
updates:
  # The actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    assignees: [rohithvarmayadla]
    groups:
      actions: { patterns: ["*"] }
  # The base images in each Dockerfile
  - package-ecosystem: docker
    directories: ["/AEMInterfaceService/AEMInterfaceService", "/CASInterfaceService/CASInterfaceService", "/CornetInterfaceService", "/job-scheduling/job-scheduling/openshift"]
    schedule: { interval: daily }
    assignees: [rohithvarmayadla]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker: { patterns: ["*"] }
  # The NuGet packages of the .NET apps, one section for each, so that each daily run stays short
  # aem-interface-service
  - package-ecosystem: nuget
    directories: ["/AEMInterfaceService"]
    schedule: { interval: daily }
    assignees: [GeorgeWalker]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-aem-interface-service: { patterns: ["*"] }
  # cas-interface-service
  - package-ecosystem: nuget
    directories: ["/CASInterfaceService"]
    schedule: { interval: daily }
    assignees: [GeorgeWalker]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-cas-interface-service: { patterns: ["*"] }
  # cornet-interface-service
  - package-ecosystem: nuget
    directories: ["/CornetInterfaceService"]
    schedule: { interval: daily }
    assignees: [GeorgeWalker]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-cornet-interface-service: { patterns: ["*"] }
  # job-scheduling
  - package-ecosystem: nuget
    directories: ["/job-scheduling"]
    schedule: { interval: daily }
    assignees: [GeorgeWalker]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-job-scheduling: { patterns: ["*"] }
  # Security fixes only for the other folders with NuGet packages: each fix still goes to its owner, and no daily pull request is opened
  - package-ecosystem: nuget
    directories: ["/AEMInterfaceService/AEMInterfaceService", "/CASInterfaceService/CASInterfaceService", "/CornetInterfaceService/CornetInterfaceService", "/Shared.Database", "/job-scheduling/job-scheduling"]
    schedule: { interval: daily }
    open-pull-requests-limit: 0
    assignees: [GeorgeWalker]
