# .github/dependabot.yml — version updates: actions + nuget + docker (no npm here).
# Small (patch/minor) updates ONLY — majors are ignored everywhere, so big jumps
# (.NET majors) arrive as security ALERTS to plan, never as surprise PRs.
# One grouped PR per ecosystem, monthly, assigned for notification. CVE
# security-update PRs come from the repo security toggles and respect the same
# ignore-majors rules. Docker block keeps the digest-pinned FROMs fresh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees: ["rohithvarmayadla"]
    groups:
      actions:
        patterns: ["*"]

  # Glob so all four services + Shared.Database are covered
  - package-ecosystem: nuget
    directories: ["/**/*"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-safe:
        patterns: ["*"]

  # The four CD-built service Dockerfiles
  - package-ecosystem: docker
    directories:
      - /CornetInterfaceService
      - /AEMInterfaceService/AEMInterfaceService
      - /CASInterfaceService/CASInterfaceService
      - /job-scheduling/job-scheduling/openshift
    schedule:
      interval: monthly
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
